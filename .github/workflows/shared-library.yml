name: Shared library probe
on:
  pull_request:
    paths:
      - 'tools/probes/shared-library/**'
      - 'tools/probes/abi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/shared-library.yml'
  push:
    branches: [main]
    paths:
      - 'tools/probes/shared-library/**'
      - 'tools/probes/abi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/shared-library.yml'

permissions:
  contents: read

jobs:
  linux-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Compile, load, call Rust ABI, check symbols, and unload
        run: bash tools/probes/shared-library/run-linux.sh
