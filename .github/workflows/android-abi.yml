name: Android ARM64 ABI link
on:
  pull_request:
    paths:
      - 'tools/probes/abi/**'
      - 'tools/probes/android/**'
      - '.github/workflows/android-abi.yml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - 'tools/probes/abi/**'
      - 'tools/probes/android/**'
      - '.github/workflows/android-abi.yml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  android-arm64-abi-link:
    name: Android ARM64 API 24 ABI link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android

      - name: Link synthetic ABI executable with runner NDK
        run: |
          if [[ -z "${ANDROID_NDK_LATEST_HOME:-}" ]]; then
            echo "GitHub-hosted Ubuntu image did not expose ANDROID_NDK_LATEST_HOME." >&2
            exit 1
          fi
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            ANDROID_API_LEVEL=24 \
            bash tools/probes/android/build-android-arm64.sh
