name: Android ARM64 ABI link
on:
  pull_request:
    paths:
      - 'tools/probes/abi/**'
      - 'tools/probes/android/**'
      - 'tools/probes/shared-library/**'
      - 'tools/probes/g2/**'
      - '.github/workflows/android-abi.yml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - 'tools/probes/abi/**'
      - 'tools/probes/android/**'
      - 'tools/probes/shared-library/**'
      - 'tools/probes/g2/**'
      - '.github/workflows/android-abi.yml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  android-arm64-abi-link:
    name: Android ARM64 API 24 ABI link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android

      - name: Link synthetic ABI executable with runner NDK
        run: |
          if [[ -z "${ANDROID_NDK_LATEST_HOME:-}" ]]; then
            echo "GitHub-hosted Ubuntu image did not expose ANDROID_NDK_LATEST_HOME." >&2
            exit 1
          fi
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            ANDROID_API_LEVEL=24 \
            bash tools/probes/android/build-android-arm64.sh

      - name: Link synthetic shared library and explicit-path loader
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            ANDROID_API_LEVEL=24 \
            bash tools/probes/android/build-android-shared-library.sh

      - name: Fetch pinned public emitter imports
        run: |
          git fetch --no-tags --depth=1 origin \
            16cba0845075868d211c63674156fa37401d852e \
            fa2cc03aa5c2369dea53856d4b11bdb9d0299b3b

      - name: Link generated G2 fixtures for Android ARM64
        run: bash tools/probes/android/build-android-g2.sh
